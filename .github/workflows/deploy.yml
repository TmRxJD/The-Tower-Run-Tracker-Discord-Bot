name: Deploy Bot

on:
  push:
    branches: [main]
    # Docs-only pushes change nothing that runs.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  repository_dispatch:
    types: [platform-updated]

concurrency:
  group: trackerbot-production
  # Queue rather than cancel: killing a deploy halfway (mid-install, mid-restart) is worse than
  # waiting. A newer push waits, and only the newest waiting run is kept.
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

# The bot runs from a long-lived checkout on the runner host: its .env.prod, .data (sqlite KV,
# pending runs) and node_modules live there, and pm2 starts it with that folder as its cwd.
# Building in the runner's throwaway _work checkout would leave the bot serving the old code
# (or, worse, restart it from a folder with none of that state), so every step runs in place.
env:
  DEPLOY_DIR: C:/bots/trackerbot/the-tower-run-tracker-discord-bot

jobs:
  deploy:
    runs-on: self-hosted
    if: github.event_name == 'push'
    environment: production
    timeout-minutes: 30
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: C:/bots/trackerbot/the-tower-run-tracker-discord-bot

    steps:
      - name: Pull and require the exact pushed revision
        shell: node {0}
        run: |
          const { execFileSync } = require('child_process')
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim()
          const fail = reason => { throw new Error('Deployment refused: ' + reason) }
          if (process.env.GITHUB_REPOSITORY !== 'TmRxJD/The-Tower-Run-Tracker-Discord-Bot' || process.env.GITHUB_REF !== 'refs/heads/main' || process.env.GITHUB_EVENT_NAME !== 'push' || process.env.RUNNER_ENVIRONMENT !== 'self-hosted') fail('unexpected runner or trigger')
          if (!/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA || '')) fail('missing pushed SHA')
          if (!/^(https:\/\/github\.com\/|git@github\.com:)TmRxJD\/The-Tower-Run-Tracker-Discord-Bot(?:\.git)?$/i.test(git('remote', 'get-url', 'origin'))) fail('unexpected origin')
          if (git('branch', '--show-current') !== 'main' || git('status', '--porcelain', '--untracked-files=normal')) fail('production source must be clean main')
          git('fetch', 'origin', 'main')
          if (git('rev-parse', 'refs/remotes/origin/main') !== process.env.GITHUB_SHA) fail('main changed after this push; use the newer run')
          git('pull', '--ff-only', 'origin', 'main')
          if (git('rev-parse', 'HEAD') !== process.env.GITHUB_SHA) fail('checkout does not match pushed SHA')

      - name: Enforce deployment guard
        run: pnpm run deploy:guard

      - name: Resolve deployment metadata
        shell: node {0}
        run: |
          const fs = require('fs')
          let platformVersion
          if (process.env.GITHUB_EVENT_NAME === 'repository_dispatch') {
            platformVersion = ${{ toJSON(github.event.client_payload.version) }} || ''
          } else {
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            platformVersion = pkg.dependencies?.['@tmrxjd/platform'] || pkg.devDependencies?.['@tmrxjd/platform'] || ''
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `PLATFORM_VERSION=${platformVersion}\n`)

      - name: Run preflight checks
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ vars.CLIENT_ID }}
        run: pnpm run deploy:preflight

      - name: Install dependencies
        run: pnpm run deploy:install

      - name: Validate local runtime env files
        shell: node {0}
        run: |
          const fs = require('fs')
          const path = require('path')
          const expected = ['.env.prod.local', '.env.prod', '.env.local', '.env'].map(f => path.join(process.cwd(), f))
          const found = expected.filter(f => fs.existsSync(f))
          if (found.length > 0) {
            console.log(`Using existing local env files: ${found.join(', ')}`)
            process.exit(0)
          }
          console.error(`No env file found. Expected one of: ${expected.join(', ')}`)
          process.exit(1)

      # A broken build must never reach the running bot; these run before anything is restarted.
      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Test
        # From an isolated copy of the committed files: the bots resolve their data relative to the
        # working directory, so running in place would let tests read and write production state.
        run: pnpm run deploy:test

      - name: Recheck clean pushed source before production changes
        run: pnpm run deploy:guard

      - name: Register slash commands
        # Skips itself (in about a second) when the command definitions are unchanged since the
        # last successful registration; only a real change pays for the per-server work.
        run: pnpm run deploy:commands

      - name: Activate bot service
        # activate compiles dist/ in place, then start-or-restarts pm2 from ecosystem.config.cjs.
        run: pnpm run deploy:activate

      - name: Verify the bot stays up
        # Fails the job (with the error log tail) if the new build crash-loops or drops offline.
        run: pnpm run deploy:verify

  require-pushed-platform-update:
    if: github.event_name == 'repository_dispatch'
    runs-on: self-hosted
    steps:
      - name: Refuse deployment of unpublished dependency changes
        shell: node {0}
        run: |
          throw new Error('Platform changes must be committed and pushed to main. This dispatch does not deploy or mutate production.')
