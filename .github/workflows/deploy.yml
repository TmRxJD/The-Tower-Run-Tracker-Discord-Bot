name: Deploy Bot

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [platform-updated]

concurrency:
  group: trackerbot-deploy-${{ github.event_name == 'repository_dispatch' && 'dispatch' || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  deploy:
    runs-on: self-hosted
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    environment: production
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@tmrxjd'
          always-auth: true

      - name: Resolve deployment metadata
        shell: node {0}
        run: |
          const fs = require('fs')
          let platformVersion
          if (process.env.GITHUB_EVENT_NAME === 'repository_dispatch') {
            platformVersion = ${{ toJSON(github.event.client_payload.version) }} || ''
          } else {
            const pkg = require('./package.json')
            platformVersion = pkg.dependencies?.['@tmrxjd/platform'] || pkg.devDependencies?.['@tmrxjd/platform'] || ''
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `PLATFORM_VERSION=${platformVersion}\n`)

      - name: Run preflight checks
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ vars.CLIENT_ID }}
        run: pnpm run deploy:preflight

      - name: Update platform dependency
        if: github.event_name == 'repository_dispatch'
        run: pnpm run deploy:platform:update

      - name: Install dependencies
        run: pnpm run deploy:install

      - name: Validate local runtime env files
        shell: node {0}
        run: |
          const fs = require('fs')
          const path = require('path')
          let envRoot
          if (process.env.TRACKERBOT_ENV_DIR) {
            if (!fs.existsSync(process.env.TRACKERBOT_ENV_DIR)) {
              console.error(`TRACKERBOT_ENV_DIR does not exist: ${process.env.TRACKERBOT_ENV_DIR}`)
              process.exit(1)
            }
            envRoot = fs.realpathSync(process.env.TRACKERBOT_ENV_DIR)
          } else {
            envRoot = process.cwd()
          }

          const expected = ['.env.prod.local', '.env.prod', '.env.local', '.env'].map(f => path.join(envRoot, f))
          const found = expected.filter(f => fs.existsSync(f))
          if (found.length > 0) {
            console.log(`Using existing local env files from the runner: ${found.join(', ')}`)
            process.exit(0)
          }

          console.error(`No local env file found on the runner. Expected one of: ${expected.join(', ')}`)
          process.exit(1)

      - name: Build service
        run: pnpm run deploy:build

      - name: Register slash commands
        run: pnpm run deploy:commands

      - name: Activate bot service
        run: pnpm run deploy:activate

      - name: Commit platform dependency bump
        if: github.event_name == 'repository_dispatch'
        shell: node {0}
        run: |
          const { execSync } = require('child_process')
          const run = cmd => execSync(cmd, { stdio: 'inherit' })
          const dirty = execSync('git status --porcelain -- package.json pnpm-lock.yaml').toString().trim()
          if (!dirty) process.exit(0)
          run('git config user.name "github-actions[bot]"')
          run('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"')
          run('git add package.json pnpm-lock.yaml')
          run(`git commit -m "chore: bump @tmrxjd/platform to ${process.env.PLATFORM_VERSION}"`)
          run('git push')
